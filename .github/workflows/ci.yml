name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run public fresh-clone test command
        run: |
          set -o pipefail
          log_path="${RUNNER_TEMP}/container-command-ladder.txt"
          set +e
          {
            echo '$ ./tools/dev test'
            ./tools/dev test
          } 2>&1 | tee "${log_path}"
          test_status="$?"
          set -e
          cp "${log_path}" container-command-ladder.txt
          exit "${test_status}"

      - name: Record container identity and tool versions
        if: always()
        run: |
          {
            docker image inspect "tsx-lvgl-dev:local" --format 'image_id={{.Id}} created={{.Created}}'
            docker run --rm "tsx-lvgl-dev:local" bash -lc '
              node --version
              npm --version
              idf.py --version
            '
          } | tee container-toolchain.txt

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-validation-${{ github.sha }}
          path: |
            container-toolchain.txt
            container-command-ladder.txt
          if-no-files-found: error
